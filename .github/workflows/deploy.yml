name: Deploy VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bank
          MYSQL_DATABASE: bank_test
          MYSQL_USER: bank
          MYSQL_PASSWORD: bank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbank --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/bank_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: bank
          SPRING_DATASOURCE_PASSWORD: bank
        run: ./mvnw -B test

  deploy:
    name: Deploy to Hostinger VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing GitHub secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync and restart containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_COMPOSE_FILE: ${{ secrets.VPS_COMPOSE_FILE }}
        run: |
          APP_DIR="${VPS_APP_DIR:-/opt/bank-bookkeeping}"
          COMPOSE_FILE="${VPS_COMPOSE_FILE:-docker-compose.yml}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude 'var/' \
            --exclude '.env' \
            --exclude '_temp/' \
            --exclude '.vscode/' \
            --exclude '.DS_Store' \
            ./ "${VPS_USER}@${VPS_HOST}:${APP_DIR}/"
          ssh "${VPS_USER}@${VPS_HOST}" "cd '${APP_DIR}' && docker compose -f '${COMPOSE_FILE}' up --build -d"

      - name: Wait for /login
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_COMPOSE_FILE: ${{ secrets.VPS_COMPOSE_FILE }}
        run: |
          APP_DIR="${VPS_APP_DIR:-/opt/bank-bookkeeping}"
          COMPOSE_FILE="${VPS_COMPOSE_FILE:-docker-compose.yml}"
          ssh "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          set -euo pipefail
          for i in \$(seq 1 90); do
            code=\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8086/login 2>/dev/null || echo 000)
            echo "try \$i login=\$code"
            if [ "\$code" = "200" ] || [ "\$code" = "302" ]; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for /login"
          cd '${APP_DIR}'
          docker compose -f '${COMPOSE_FILE}' ps || true
          docker compose -f '${COMPOSE_FILE}' logs --tail 80 api || true
          exit 1
          EOF
