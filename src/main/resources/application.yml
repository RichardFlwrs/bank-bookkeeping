spring:
  application:
    name: bank
  datasource:
    url: jdbc:mysql://localhost:3307/bank?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: bank
    password: bank
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    generator:
      write-bigdecimal-as-plain: true
  thymeleaf:
    cache: false


server:
  port: 8086

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  bank-seed:
    seed: 42
    customers: 1000
    merchants: 50
    opening-deposit: 1000.00

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://localhost:3307/bank_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: bank
    password: bank
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false

app:
  bank-seed:
    customers: 5
    merchants: 2
    opening-deposit: 1000.00
