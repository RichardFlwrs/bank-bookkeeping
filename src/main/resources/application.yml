spring:
  application:
    name: bank
  datasource:
    url: jdbc:sqlite:./var/bank_dev.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    generator:
      write-bigdecimal-as-plain: true


server:
  port: 8086

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  bank-seed:
    seed: 42
    customers: 1000
    merchants: 50
    opening-deposit: 1000.00

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:sqlite:./var/bank_test.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false

app:
  bank-seed:
    customers: 5
    merchants: 2
    opening-deposit: 1000.00
