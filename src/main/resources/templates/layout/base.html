<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE — Bank">Bank</title>
    <link rel="stylesheet" th:href="@{/css/bank.css}">
</head>
<body>
<header class="site-header">
    <nav class="site-nav" aria-label="Primary">
        <a th:href="@{/ledger/accounts}">All accounts</a>
        <a th:href="@{/ledger/me}">My ledger</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/ledger/pay}">Pay</a>
        <span class="spacer"></span>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </nav>
</header>
<main layout:fragment="content">
</main>
</body>
</html>
