<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Ledger accounts</title>
</head>
<body>
<main layout:fragment="content">
    <h1>Ledger accounts</h1>
    <p class="lead">
        <span id="account-count" th:text="${accounts.size()}">0</span>
        accounts from <code>GET /api/ledger/accounts</code>.
    </p>
    <table>
        <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Type</th>
            <th class="num">Posted</th>
            <th class="num">Available</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
            <td class="mono" th:text="${account.code}">1000</td>
            <td th:text="${account.name}">Cash</td>
            <td th:text="${account.type}">ASSET</td>
            <td class="mono num" th:text="${account.posted}">0.00</td>
            <td class="mono num" th:text="${account.available}">0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(accounts)}">
            <td colspan="5">No accounts.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
