<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Pay</title>
</head>
<body>
<main layout:fragment="content">
    <section class="pay-hero">
        <p class="pay-hero-label">Available</p>
        <p class="pay-balance mono" id="available-balance"
           th:text="${available}"
           th:attr="data-available=${available}">0.00</p>
    </section>

    <p class="flash" th:if="${error != null}" th:text="${error}">insufficient_available</p>

    <form class="pay-form" th:action="@{/ledger/pay}" method="post">
        <div class="pay-field">
            <label for="amount">Amount to pay</label>
            <div class="pay-row">
                <input id="amount" name="amount" type="number" step="0.01" min="0.01" required
                       th:value="${amount}">
                <button type="button" class="dice" id="dice-amount" aria-label="Random amount">🎲</button>
            </div>
        </div>

        <div class="pay-field">
            <label for="label">Label of payment</label>
            <div class="pay-row">
                <input id="label" name="label" type="text" maxlength="160" required
                       th:value="${label}" placeholder="coffee, mug, …">
                <button type="button" class="dice" id="dice-label" aria-label="Random label">🎲</button>
            </div>
        </div>

        <div class="pay-field">
            <label for="merchantId">Merchant</label>
            <div class="pay-row">
                <select id="merchantId" name="merchantId" required>
                    <option value="" disabled th:selected="${merchantId == null}">Select a merchant</option>
                    <option th:each="merchant : ${merchants}"
                            th:value="${merchant.id}"
                            th:text="${merchant.name}"
                            th:selected="${merchantId != null and merchantId == merchant.id}">
                        Café Orquídea
                    </option>
                </select>
                <button type="button" class="dice" id="dice-merchant" aria-label="Random merchant">🎲</button>
            </div>
        </div>

        <button type="submit" class="pay-submit">Pay</button>
    </form>

    <script th:inline="javascript">
        (function () {
            const labels = [
                'coffee', 'mug', 'notebook', 'pastry', 'tea', 'sandwich',
                'headphones', 'sticker pack', 'umbrella', 'water bottle',
                'plant', 'candle', 'scarf', 'keychain', 'chocolate'
            ];

            const availableEl = document.getElementById('available-balance');
            const amountInput = document.getElementById('amount');
            const labelInput = document.getElementById('label');
            const merchantSelect = document.getElementById('merchantId');

            function money(value) {
                return value.toFixed(2);
            }

            function randomAmount() {
                const available = Number(availableEl.dataset.available || '0');
                const max = Math.min(9999.99, Math.max(1.00, available));
                const min = 1.00;
                if (max < min) {
                    return money(min);
                }
                const cents = Math.floor(Math.random() * (Math.round(max * 100) - Math.round(min * 100) + 1))
                    + Math.round(min * 100);
                return money(cents / 100);
            }

            document.getElementById('dice-amount').addEventListener('click', function () {
                amountInput.value = randomAmount();
            });

            document.getElementById('dice-label').addEventListener('click', function () {
                labelInput.value = labels[Math.floor(Math.random() * labels.length)];
            });

            document.getElementById('dice-merchant').addEventListener('click', function () {
                const options = Array.from(merchantSelect.options).filter(function (o) {
                    return o.value !== '';
                });
                if (options.length === 0) {
                    return;
                }
                const pick = options[Math.floor(Math.random() * options.length)];
                merchantSelect.value = pick.value;
            });
        })();
    </script>
</main>
</body>
</html>
